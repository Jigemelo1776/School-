name: Build Msaranga SS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Msaranga Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No Android project ZIP found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          mkdir -p android_project
          unzip -o "$ZIP_FILE" -d android_project

          echo "Project files:"
          find android_project -maxdepth 3 -type f | head -100

      - name: Build APK
        working-directory: android_project
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MsarangaSS-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
